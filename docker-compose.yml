  services:
    postgres:
      image: postgres:16
      container_name: techstore_postgres
      restart: always
      environment:
        POSTGRES_DB: techstore_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 1234
      ports:
       - "5433:5432"
      volumes:
       - postgres_data:/var/lib/postgresql/data

    app:
      build: .
      container_name: techstore_api
      restart: always
      depends_on:
       - postgres   
      ports:
       - "8080:8080"
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/techstore_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: 1234

  volumes:
    postgres_data: