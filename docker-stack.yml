version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: techstore_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - techstore-net
    deploy:
      replicas: 1

  techstore-api:
    image: techstore-api:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/techstore_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    networks:
      - techstore-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:

networks:
  techstore-net:
    driver: overlay